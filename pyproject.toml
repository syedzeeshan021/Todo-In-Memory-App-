[project]
name = "todo-console-app"
version = "0.1.0"
description = "Todo In-Memory Python Console App with intermediate features (priorities, tags, search, filter, sort)"
authors = [
    {name = "Todo App Developer", email = "developer@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
]